[project]
name = "game-of-life-backend"
version = "0.1.0"
description = "Multi-species particle simulation backend with ECS architecture"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.27.1",
    "websockets>=13.0",
    "pydantic==2.6.1",
    "python-dotenv==1.0.0",
    "httpx==0.26.0",
    "numpy==1.26.3",
    "sqlalchemy==2.0.32",
    "pydantic-settings>=2.0.0",
    "uvloop>=0.22.1",
    "msgpack>=1.1.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==7.4.4",
    "pytest-asyncio==0.23.5",
    "pytest-cov==4.1.0",
    "httpx==0.26.0",
    # Debugging
    "debugpy==1.8.0",
    "ipython==8.12.0",
    # Code Quality
    "black==23.12.1",
    "flake8==7.0.0",
    "mypy==1.8.0",
    "isort==5.13.2",
    # Documentation
    "mkdocs==1.5.3",
    "mkdocs-material==9.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
